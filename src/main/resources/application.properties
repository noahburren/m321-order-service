spring.application.name=m321-service-noah
server.port=8081
# Local RabbitMQ (can be overridden with environment variables)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# One in-flight message per consumer makes Ready and Unacked easy to observe.
spring.rabbitmq.listener.simple.prefetch=1

# OAuth2 Resource Server / Keycloak (local development defaults)
# Supplying both values validates the issuer while avoiding a discovery call at startup.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/m321}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/m321/protocol/openid-connect/certs}

# Swagger UI can use Keycloak's public client with Authorization Code + PKCE.
springdoc.swagger-ui.oauth.client-id=${KEYCLOAK_CLIENT_ID:m321-order-client}
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true

messaging.auto-producer.enabled=true
messaging.auto-producer.interval=1800
messaging.consumer.processing-time=3000

spring.task.scheduling.pool.size=2
